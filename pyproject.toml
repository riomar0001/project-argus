[project]
name = "project-argus"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "riomar0001", email = "mariojringuito@riomar.dev" }]
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.43.123",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "psutil>=7.2.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "torch>=2.15.0",
    "transformers>=5.23.0",
    "xgboost>=3.4.1",
]

[project.scripts]
project-argus = "lib.datasets:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "lib"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "moto>=5.2.5",
    "nbclient>=0.11.0",
]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu132" }
